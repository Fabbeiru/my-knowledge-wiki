<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" role="button" tabindex="0" aria-label="knowledge wiki - Ir al inicio" (click)="goHome()" (keydown.enter)="goHome()">
        <img class="logo-icon" src="./assets/images/logo.svg" alt="" width="32" height="32">
        <span aria-hidden="true">knowledge wiki</span>
      </div>
      <div class="right-controls">
        <search-bar />
        <button class="theme-toggle" (click)="themeService.toggle()"
          [attr.aria-label]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          [title]="themeService.isDark() ? 'Modo claro' : 'Modo oscuro'">
          @if (themeService.isDark()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
          } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          }
        </button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <div class="app-body-inner">
      <router-outlet />
    </div>
  </div>

  <footer class="app-footer">
    <span>© {{ currentYear }} Fabián Beirutti</span>
    <img class="footer-logo" src="./assets/images/myLogo.png" alt="Logo de Fabián Beirutti">
  </footer>
</div>
