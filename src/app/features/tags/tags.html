<div class="tags-view">
    <div class="tags-outer">
        <div class="centered-layout">

            <div class="breadcrumb">
                <span class="bc-link" (click)="goBack()">Inicio</span>
                <span class="bc-sep">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </span>
                <span class="bc-current">Tags</span>
            </div>

            <h1 class="tags-title">Todos los tags</h1>
            <p class="tags-subtitle">{{ tags().length }} tags — el tamaño indica cuántas notas los usan</p>

            @if (tags().length === 0) {
            <div class="empty-state">
                <p>Todavía no hay tags</p>
            </div>
            } @else {
            <div class="tag-cloud">
                @for (item of tags(); track item.tag) {
                <button class="tag-cloud-item" [style.font-size]="fontSizeFor(item.count)"
                    (click)="onSelectTag(item.tag)">
                    {{ item.tag }}
                    <span class="tag-count">{{ item.count }}</span>
                </button>
                }
            </div>
            }

        </div>
    </div>
</div>
